#   TA-apple tags.conf — vendor-neutral dataset tags for the Wearables model.
#   apple:activity carries the daily activity totals + doubles into the Daily root
#   (like garmin:dailies). apple:daily = one-per-day vitals (resting HR, HRV,
#   respiration, SpO2, skin temp). apple:heartrate is the optional per-sample HR
#   firehose (default off in the puller).

[eventtype=apple_sleep]
wearable = enabled
wearable_sleep = enabled

[eventtype=apple_activity]
wearable = enabled
wearable_activity = enabled
wearable_daily = enabled

[eventtype=apple_daily]
wearable = enabled
wearable_daily = enabled

[eventtype=apple_bodycomp]
wearable = enabled
wearable_daily = enabled

[eventtype=apple_heartrate]
wearable = enabled
wearable_heartrate = enabled

[eventtype=apple_workout]
wearable = enabled
wearable_workout = enabled

[eventtype=apple_extra]
wearable = enabled
wearable_extra = enabled

[eventtype=apple_medications]
wearable = enabled
wearable_medication = enabled
