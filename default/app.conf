#   TA-apple — Apple Health technology add-on for the Wearables platform.
#   Apple Health (HealthKit) is on-device only (no cloud API), so the iOS app
#   "Health Auto Export" (HAE) writes JSON exports to a synced folder (iCloud /
#   Dropbox); tools/apple_to_hec.py pulls those files, explodes them into clean
#   per-record canonical events, maps each sample's HealthKit source -> canonical
#   vendor, stamps person_id, and delivers to HEC (index=wearables).
#   Apple Health is an AGGREGATOR (many devices write into it) — see INSTALL.md
#   for the source->vendor mapping + skip_sources dedup vs the direct vendor TAs.

[install]
is_configured = 0
build = 20260729a

[package]
id = TA-apple

[id]
name = TA-apple
version = 0.1.6

[ui]
is_visible = 0
label = Apple Health Add-on (Wearables)

[launcher]
author = Tony Vincent
description = Apple Health technology add-on: normalizes Health Auto Export (HealthKit) data into the canonical Wearables data model. Source & docs: https://github.com/narwhaldc
version = 0.1.6

[manifest]
category = Add-on
