#   TA-apple props.conf — Apple Health via Health Auto Export.
#
#   Unlike TA-oura/TA-garmin (which emit vendor-native field names and map them to
#   canonical fields here in props), TA-apple does the reshaping in the PULLER
#   (tools/apple_to_hec.py): Apple's export is a deeply-nested, per-sample JSON
#   with locale units and a reserved-name `source` field, so the puller explodes
#   it, converts units to SI, renames source->hk_source, derives vendor, and emits
#   ALREADY-CANONICAL per-record events (steps, total_sleep_min, weight_kg, ...)
#   with indexed `vendor` + `person_id`. So these stanzas are light: JSON field
#   extraction + the shared person enrichment lookup. Dataset membership is set by
#   eventtypes.conf + tags.conf.

[apple:sleep]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
LOOKUP-wearable_person = wearable_person_profile person_id OUTPUT person_name step_goal

