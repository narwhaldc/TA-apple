#   TA-apple eventtypes.conf — tag Apple Health (Health Auto Export) events into
#   the Wearables model. Sourcetypes match tools/apple_to_hec.py output.

[apple_sleep]
search = sourcetype=apple:sleep

[apple_activity]
search = sourcetype=apple:activity

[apple_daily]
search = sourcetype=apple:daily

[apple_bodycomp]
search = sourcetype=apple:bodycomp

[apple_heartrate]
search = sourcetype=apple:heartrate

[apple_workout]
search = sourcetype=apple:workout

[apple_extra]
search = sourcetype=apple:extra
